appId: com.dcw.fastque
---
- launchApp:
    appId: com.dcw.fastque
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible: "Menu"
    timeout: 45000
- tapOn: "Menu"
- assertVisible: "Shop Owner"
- tapOn: "Shop Owner"
- extendedWaitUntil:
    visible: "Sign in to your shop"
    timeout: 20000
- assertVisible: "Continue with Google"
- assertVisible: "you@example.com"
