appId: com.dcw.fastque
---
- launchApp:
    appId: com.dcw.fastque
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible: "Your Style."
    timeout: 45000
- tapOn: "Menu"
- assertVisible: "Barber / Staff"
- tapOn: "Barber / Staff"
- extendedWaitUntil:
    visible: "Sign in to work today"
    timeout: 20000
- assertVisible: "Continue with Google"
- assertVisible: "you@example.com"
