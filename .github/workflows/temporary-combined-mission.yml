name: temporary-combined-mission

on:
  push:
    branches:
      - feat/manual-chair-and-online-payment

permissions:
  contents: write

env:
  # Prisma validate/generate require DATABASE_URL to exist syntactically, but these steps do not
  # connect to it. This is a deliberately unreachable non-production placeholder, never a secret.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fastque_validation

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manual-chair-and-online-payment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply surgical patch
        run: python .github/fastque-combined-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Prisma validate and generate
        run: |
          npm run prisma:validate --workspace=@barbercue/backend
          npm run prisma:generate --workspace=@barbercue/backend
      - name: Shared build
        run: npm run build --workspace=@barbercue/shared
      - name: Backend typecheck and tests
        run: |
          npm run typecheck --workspace=@barbercue/backend
          npm run test --workspace=@barbercue/backend -- --runInBand
      - name: Web typecheck and build
        run: |
          npm run typecheck --workspace=@barbercue/web
          npm run build --workspace=@barbercue/web
      - name: Mobile typecheck and tests
        run: |
          npm run typecheck --workspace=@barbercue/mobile
          npm run test --workspace=@barbercue/mobile -- --runInBand
      - name: Diff check
        run: git diff --check
      - name: Commit validated product changes and self-clean temporary runner
        run: |
          rm -f .github/fastque-combined-patch.py .github/workflows/temporary-combined-mission.yml
          git config user.name "FastQue Validation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add local chair occupancy and UPI booking payment UX"
          git push origin HEAD:feat/manual-chair-and-online-payment
