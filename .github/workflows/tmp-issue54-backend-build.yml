name: Temporary Issue54 backend build validation

on:
  push:
    branches:
      - codex/issue-54-qr-derived-upi

permissions:
  contents: write

jobs:
  backend-build-and-self-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-54-qr-derived-upi
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace=@barbercue/backend

      - name: Shared build
        run: npm run build --workspace=@barbercue/shared

      - name: Backend production build
        run: npm run build --workspace=@barbercue/backend

      - name: Product diff check
        run: git diff --check origin/master...HEAD

      - name: Self-clean temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-issue54-backend-build.yml
          git diff --cached --check
          git config user.name "FastQue delegated automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: remove temporary Issue54 backend build workflow"
          git push origin HEAD:codex/issue-54-qr-derived-upi
