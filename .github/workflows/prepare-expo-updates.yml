name: Prepare Expo Updates Dependency

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/prepare-expo-updates.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install expo-updates in mobile workspace
        run: npm install --workspace=@barbercue/mobile expo-updates@~57.0.19 --save

      - name: Commit synchronized dependency lockfile
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile/package.json package-lock.json; then
            echo "Dependency already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          git commit -m "chore(mobile): install expo-updates"
          git push
