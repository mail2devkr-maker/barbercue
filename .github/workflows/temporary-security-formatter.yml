name: Temporary Security PR Formatter

on:
  push:
    branches:
      - chatgpt/super-admin-approval-audit-control
    paths:
      - .github/workflows/temporary-security-formatter.yml

permissions:
  contents: write

jobs:
  format-security-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/super-admin-approval-audit-control
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install formatter without application lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --workspaces --include-workspace-root
      - name: Format only security PR source/tests
        run: |
          npx prettier --write \
            apps/backend/src/admin/admin-salon-management.service.spec.ts \
            apps/backend/src/admin/admin-salon-management.service.ts \
            apps/backend/src/admin/admin-security-audit.service.ts \
            apps/backend/src/admin/admin-security.controller.ts \
            apps/backend/src/admin/admin-shop-deletion-requests.service.spec.ts \
            apps/backend/src/admin/admin-shop-deletion-requests.service.ts \
            apps/backend/src/admin/admin.controller.spec.ts \
            apps/backend/src/common/interceptors/admin-activity-audit.interceptor.ts \
            apps/backend/src/common/interceptors/admin-activity-audit.interceptor.spec.ts \
            'apps/web/app/(dashboard)/dashboard/admin/page.tsx' \
            'apps/web/app/(dashboard)/dashboard/admin/security/page.tsx'
      - name: Commit formatted files to exact feature branch, never master
        run: |
          git add -- apps/backend/src/admin apps/backend/src/common/interceptors/admin-activity-audit.interceptor.ts apps/backend/src/common/interceptors/admin-activity-audit.interceptor.spec.ts 'apps/web/app/(dashboard)/dashboard/admin/page.tsx' 'apps/web/app/(dashboard)/dashboard/admin/security/page.tsx'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format security approval code [skip ci]'
            git push origin HEAD:refs/heads/chatgpt/super-admin-approval-audit-control
          fi
