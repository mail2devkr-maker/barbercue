name: PR52 Preview OTA Auth Probe

on:
  push:
    branches:
      - automation/pr52-preview-ota-probe

permissions:
  contents: read

jobs:
  expo-auth-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact probe branch
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Expo token exists without printing it
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN repository secret is not configured."
            exit 2
          fi
          echo "EXPO_TOKEN repository secret is present."

      - name: Verify EAS authentication only
        working-directory: apps/mobile
        run: npx --yes eas-cli@latest whoami --non-interactive
