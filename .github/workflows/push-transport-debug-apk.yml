name: Push Transport Debug APK

on:
  push:
    branches:
      - test/push-physical-transport
    paths:
      - '.github/workflows/push-transport-debug-apk.yml'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_API_BASE_URL: 'https://barbercuebackend-production.up.railway.app/api/v1'
      EXPO_PUBLIC_WEB_ORIGIN: 'https://barbercueweb-production.up.railway.app'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: '871155185690-bcl6bu22nphvg85hklflag78sqfp7khv.apps.googleusercontent.com'
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: '871155185690-0256keu32669iup0b8vbi20junds6d0f.apps.googleusercontent.com'

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile TypeScript
        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barbercue-push-transport-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
