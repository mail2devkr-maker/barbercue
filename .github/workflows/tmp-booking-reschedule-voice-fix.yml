        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Mobile tests
        run: npm run test --workspace=@barbercue/mobile -- --runInBand

      - name: Android export
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-voice-fix

      - name: Diff check
        run: git diff --check

      - name: Commit validated product changes and self-clean workflow
        shell: bash
        run: |
          rm -rf apps/mobile/dist-voice-fix
          git rm .github/workflows/tmp-booking-reschedule-voice-fix.yml
          git add packages/shared/src/i18n/index.ts \
                  apps/mobile/lib/voice-announce.ts \
                  apps/mobile/lib/voice-announce.android.ts \
                  apps/mobile/lib/booking-voice-dedupe.ts \
                  apps/mobile/lib/push-navigation.ts \
                  apps/mobile/components/PushNotificationCoordinator.tsx \
                  apps/mobile/screens/owner/OwnerBookingsScreen.tsx \
                  apps/mobile/lib/__tests__/voice-announce.android.test.ts \
                  apps/mobile/lib/__tests__/booking-voice-dedupe.test.ts \
                  apps/mobile/lib/__tests__/push-navigation.test.ts \
                  apps/backend/src/push-notifications/push-dispatch.service.ts \
                  apps/backend/src/push-notifications/push-dispatch.service.spec.ts \
                  apps/backend/src/bookings/bookings.service.ts \
                  apps/backend/src/bookings/bookings.service.spec.ts
          git diff --cached --check
          git config user.name "FastQue delegated automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(mobile): announce booking reschedules reliably"
          git push origin HEAD:fix/mobile-booking-reschedule-voice
