name: Temporary booking reschedule voice fix

on:
  push:
    branches:
      - fix/mobile-booking-reschedule-voice

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-booking-reschedule-voice
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply focused patch
        run: |
          python3 .github/scripts/tmp_booking_reschedule_voice_fix.py
          python3 .github/scripts/tmp_booking_reschedule_voice_typefix.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/backend/prisma/schema.prisma

      - name: Build shared
        run: npm run build --workspace=@barbercue/shared

      - name: Backend typecheck
        run: npm run typecheck --workspace=@barbercue/backend

      - name: Backend tests
        run: npm run test --workspace=@barbercue/backend -- --runInBand

      - name: Mobile typecheck
        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Mobile tests
        run: npm run test --workspace=@barbercue/mobile -- --runInBand

      - name: Android export
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-voice-fix

      - name: Diff check
        run: git diff --check

      - name: Commit validated product changes and self-clean temporary automation
        shell: bash
        run: |
          rm -rf apps/mobile/dist-voice-fix
          git rm .github/workflows/tmp-booking-reschedule-voice-fix.yml .github/scripts/tmp_booking_reschedule_voice_fix.py .github/scripts/tmp_booking_reschedule_voice_typefix.py
          git add packages/shared/src/i18n/index.ts apps/mobile apps/backend/src/bookings/bookings.service.ts apps/backend/src/bookings/bookings.service.spec.ts apps/backend/src/push-notifications/push-dispatch.service.ts apps/backend/src/push-notifications/push-dispatch.service.spec.ts
          git diff --cached --check
          git config user.name "FastQue delegated automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(mobile): announce booking reschedules reliably"
          git push origin HEAD:fix/mobile-booking-reschedule-voice
