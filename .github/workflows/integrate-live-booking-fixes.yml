name: Integrate Live Booking Fixes

on:
  push:
    branches:
      - integrate/launch-plus-live-booking-fixes
    paths:
      - .github/workflows/integrate-live-booking-fixes.yml

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: integrate/launch-plus-live-booking-fixes
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick Codex fix commit with controlled conflict merge
        env:
          CODEX_COMMIT: e836bb41a5f8a5f6f4caef0d0c9835e89c75674c
        run: |
          set -euo pipefail
          set +e
          git cherry-pick "$CODEX_COMMIT"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            expected=(
              "apps/backend/src/bookings/availability.service.ts"
              "apps/web/components/booking/RescheduleBookingDialog.tsx"
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            if [ "$(printf '%s\n' "${conflicts[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]; then
              echo "Unexpected conflict set; aborting without pushing."
              git cherry-pick --abort
              exit 1
            fi

            # Keep the launch-candidate semantics in the two conflicting files, then layer in
            # Codex's additive occupied-state UX. All non-conflicting Codex changes remain staged.
            git checkout --ours -- apps/backend/src/bookings/availability.service.ts apps/web/components/booking/RescheduleBookingDialog.tsx

            python3 - <<'PY'
from pathlib import Path

# Backend: preserve launch candidate's staff-specific availability guard and add explicit state.
p = Path('apps/backend/src/bookings/availability.service.ts')
s = p.read_text()
old = """      slots.push({
        slotStart: slotStart.toISOString(),
        slotEnd: slotEnd.toISOString(),
        available,
      });"""
new = """      slots.push({
        slotStart: slotStart.toISOString(),
        slotEnd: slotEnd.toISOString(),
        available,
        state: available ? 'AVAILABLE' : 'OCCUPIED',
      });"""
if old not in s:
    raise SystemExit('availability merge marker missing')
s = s.replace(old, new, 1)
p.write_text(s)

# Web reschedule: preserve salon-timezone formatting and add cinema-style occupied/selected states.
p = Path('apps/web/components/booking/RescheduleBookingDialog.tsx')
s = p.read_text()
old = """            {!slotsLoading && slots.length > 0 && (
              <div className={styles.slotGrid}>
                {slots.map((slot) => (
                  <button
                    key={slot.slotStart}
                    type=\"button\"
                    disabled={!slot.available}
                    onClick={() => setSelectedSlot(slot)}
                    className={`${styles.slotChip} ${selectedSlot?.slotStart === slot.slotStart ? styles.slotChipSelected : \"\"}`}
                  >
                    {booking.salonTimeZone
                      ? formatZonedTime(slot.slotStart, booking.salonTimeZone)
                      : new Date(slot.slotStart).toLocaleTimeString(undefined, { hour: \"2-digit\", minute: \"2-digit\" })}
                  </button>
                ))}
              </div>
            )}"""
new = """            {!slotsLoading && slots.length > 0 && (
              <>
                <div className={styles.slotLegend} aria-label=\"Time availability legend\">
                  <span><i className={`${styles.legendSwatch} ${styles.legendAvailable}`} aria-hidden=\"true\" /> Available</span>
                  <span><i className={`${styles.legendSwatch} ${styles.legendSelected}`} aria-hidden=\"true\" /> Your selection</span>
                  <span><i className={`${styles.legendSwatch} ${styles.legendOccupied}`} aria-hidden=\"true\" /> Occupied</span>
                </div>
                <div className={styles.slotGrid}>
                  {slots.map((slot) => {
                    const occupied = slot.state === \"OCCUPIED\" || !slot.available;
                    return (
                      <button
                        key={slot.slotStart}
                        type=\"button\"
                        disabled={occupied}
                        onClick={() => setSelectedSlot(slot)}
                        className={`${styles.slotChip} ${occupied ? styles.slotChipOccupied : \"\"} ${selectedSlot?.slotStart === slot.slotStart ? styles.slotChipSelected : \"\"}`}
                      >
                        {booking.salonTimeZone
                          ? formatZonedTime(slot.slotStart, booking.salonTimeZone)
                          : new Date(slot.slotStart).toLocaleTimeString(undefined, { hour: \"2-digit\", minute: \"2-digit\" })}
                      </button>
                    );
                  })}
                </div>
              </>
            )}"""
if old not in s:
    raise SystemExit('reschedule merge marker missing')
s = s.replace(old, new, 1)
p.write_text(s)
PY

            git add apps/backend/src/bookings/availability.service.ts apps/web/components/booking/RescheduleBookingDialog.tsx
            GIT_EDITOR=true git cherry-pick --continue
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate shared package
        run: |
          npm run typecheck -w @barbercue/shared
          npm test -w @barbercue/shared -- --runInBand

      - name: Validate backend
        run: |
          npm run typecheck -w apps/backend
          npm test -w apps/backend -- --runInBand availability.service.spec.ts salons.service.spec.ts

      - name: Validate web
        run: npm run typecheck -w apps/web

      - name: Validate mobile
        run: npm run typecheck -w apps/mobile

      - name: Verify integration delta
        run: |
          git status --short
          test -z "$(git status --porcelain)"
          git log --oneline -4

      - name: Push validated integration commit
        run: git push origin HEAD:integrate/launch-plus-live-booking-fixes
