name: Temporary Issue54 QR-derived UPI validation

on:
  push:
    branches:
      - codex/issue-54-qr-derived-upi

permissions:
  contents: write

jobs:
  validate-and-self-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-54-qr-derived-upi
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npm run prisma:validate --workspace=@barbercue/backend

      - name: Prisma generate
        run: npm run prisma:generate --workspace=@barbercue/backend

      - name: Shared build
        run: npm run build --workspace=@barbercue/shared

      - name: Shared typecheck
        run: npm run typecheck --workspace=@barbercue/shared

      - name: Shared tests
        run: npm run test --workspace=@barbercue/shared -- --runInBand

      - name: Backend typecheck
        run: npm run typecheck --workspace=@barbercue/backend

      - name: Backend tests
        run: npm run test --workspace=@barbercue/backend -- --runInBand

      - name: Web typecheck
        run: npm run typecheck --workspace=@barbercue/web

      - name: Web tests
        run: npx jest --config apps/web/jest.config.cjs --runInBand

      - name: Web production build
        run: npm run build --workspace=@barbercue/web

      - name: Mobile typecheck
        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Mobile tests
        run: npm run test --workspace=@barbercue/mobile -- --runInBand

      - name: Android Expo export
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-issue54-qr-derived-upi

      - name: Product diff check
        run: git diff --check origin/master...HEAD

      - name: Self-clean temporary validation workflow
        shell: bash
        run: |
          rm -rf apps/mobile/dist-issue54-qr-derived-upi
          git rm .github/workflows/tmp-issue54-qr-derived-upi.yml
          git diff --cached --check
          git config user.name "FastQue delegated automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci: remove temporary Issue54 QR validation workflow"
          git push origin HEAD:codex/issue-54-qr-derived-upi
