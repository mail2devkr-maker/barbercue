name: Publish Push E2E Launch APK

on:
  push:
    branches:
      - test/push-e2e-launch-candidate
    paths:
      - .github/workflows/publish-push-e2e-launch-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: barbercue-google-ota-fix-20260901
      SOURCE_RUN_ID: "33448710346"
      ARTIFACT_NAME: barbercue-launch-candidate-arm64-apk
    steps:
      - name: Confirm final launch-candidate build succeeded
        run: gh run watch "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download exact final APK artifact
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist
          test -f dist/app-release.apk
          mv dist/app-release.apk dist/barbercue-google-ota-fix-arm64.apk

      - name: Publish Google sign-in and OTA fixed prerelease
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/barbercue-google-ota-fix-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target test/push-e2e-launch-candidate \
            --prerelease \
            --title "BarberCue — Google Sign-In + OTA Update Fix" \
            --notes "Android arm64 launch candidate. Fixes the Google Credential Manager fallback flow, adds the Android Google audience on the production backend, enables Expo OTA updates on the preview channel, checks/applies updates on app launch and after meaningful foreground returns, and bumps Android versionCode to 2 so this candidate can upgrade the earlier test APK."
