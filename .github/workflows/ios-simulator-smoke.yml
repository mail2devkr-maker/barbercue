name: FastQue iOS App Store Screenshot QA

on:
  pull_request:
    branches:
      - codex/fastque-ios-assistant-master-9835067-20261105
    paths:
      - ".github/workflows/ios-simulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-synthetic-screenshots:
    name: Synthetic backend, Dynamic Island iPhone and 13-inch iPad screenshots
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Busy hosted macOS runners can take minutes to boot the XCTest driver (run 43297879168 timed out).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      FASTQUE_IOS_BUILD: "true"
      APP_SOURCE_SHA: 1353420f737ad70191cab46ecad023f817fe1848
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:3000/api/v1
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 123456789012-test_client.apps.googleusercontent.com
      NODE_ENV: test
      PORT: "3000"

    steps:
      - name: Checkout isolated screenshot candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove app/backend source is the requested SHA
        run: |
          set -euo pipefail
          git cat-file -e "$APP_SOURCE_SHA^{commit}"
          for path in apps/mobile apps/backend packages/shared package-lock.json; do
            expected="$(git rev-parse "$APP_SOURCE_SHA:$path")"
            actual="$(git rev-parse "HEAD:$path")"
            if [ "$expected" != "$actual" ]; then
              echo "Source mismatch at $path; refusing screenshots."
              exit 1
            fi
          done
          echo "FastQue app, backend, shared contracts, and lockfile match $APP_SOURCE_SHA."

      - name: Verify Xcode and install locked dependencies
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version
          npm --version
          pod --version
          npm ci

      - name: Build shared and backend packages
        run: |
          set -euo pipefail
          npm run build:shared
          npm run build --workspace=@barbercue/backend

      - name: Create disposable local PostgreSQL
        run: |
          set -euo pipefail
          brew install postgresql@17
          PG_BIN="$(brew --prefix postgresql@17)/bin"
          PGDATA="$RUNNER_TEMP/fastque-synthetic-pg"
          PGUSER="$(id -un)"
          "$PG_BIN/initdb" -D "$PGDATA" --username="$PGUSER" --auth-local=trust --auth-host=trust --no-locale --encoding=UTF8 >/dev/null
          "$PG_BIN/pg_ctl" -D "$PGDATA" -l "$RUNNER_TEMP/fastque-synthetic-postgres.log" -o "-h 127.0.0.1 -p 5432" start
          "$PG_BIN/createdb" -h 127.0.0.1 -p 5432 --username="$PGUSER" fastque_screenshots
          printf 'DATABASE_URL=postgresql://%s@127.0.0.1:5432/fastque_screenshots?schema=public\n' "$PGUSER" >> "$GITHUB_ENV"
          printf 'DIRECT_DATABASE_URL=postgresql://%s@127.0.0.1:5432/fastque_screenshots?schema=public\n' "$PGUSER" >> "$GITHUB_ENV"

      - name: Apply migrations and seed synthetic salon data
        working-directory: apps/backend
        run: |
          set -euo pipefail
          export ADMIN_SEED_EMAIL='screenshot-admin@example.invalid'
          export ADMIN_SEED_PASSWORD="$(openssl rand -hex 24)"
          export TOTP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          BOOTSTRAP_PRISMA_DIR="$RUNNER_TEMP/prisma-before-primary-admin"
          mkdir -p "$BOOTSTRAP_PRISMA_DIR/migrations"
          cp prisma/schema.prisma "$BOOTSTRAP_PRISMA_DIR/schema.prisma"
          cp prisma/migrations/migration_lock.toml "$BOOTSTRAP_PRISMA_DIR/migrations/migration_lock.toml"
          python3 - "$BOOTSTRAP_PRISMA_DIR/migrations" <<'PY'
          import pathlib, shutil, sys
          source = pathlib.Path("prisma/migrations")
          target = pathlib.Path(sys.argv[1])
          cutoff = "20260830215000_ensure_primary_platform_admin"
          copied = []
          for migration in sorted(p for p in source.iterdir() if p.is_dir() and p.name < cutoff):
              shutil.copytree(migration, target / migration.name)
              copied.append(migration.name)
          if not copied or not (target / "20260801060723_init").is_dir():
              raise SystemExit("Could not prepare the verified migration prefix.")
          print(f"Applying {len(copied)} prerequisite migrations before the admin-guard migration.")
          PY
          npx prisma migrate deploy --schema "$BOOTSTRAP_PRISMA_DIR/schema.prisma"
          PRIMARY_ADMIN_EMAIL="$(python3 - <<'PY'
          import pathlib, re
          sql = pathlib.Path("prisma/migrations/20260830215000_ensure_primary_platform_admin/migration.sql").read_text()
          match = re.search(r"""WHERE lower\("email"\) = lower\('([^']+)'\)""", sql)
          if not match:
              raise SystemExit("Unable to identify the required migration fixture identity.")
          print(match.group(1))
          PY
          )"
          echo "::add-mask::$PRIMARY_ADMIN_EMAIL"
          SYNTHETIC_ADMIN_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          psql -h 127.0.0.1 -p 5432 --username "$(id -un)" --dbname fastque_screenshots -v ON_ERROR_STOP=1 -q -v admin_id="$SYNTHETIC_ADMIN_ID" -v admin_email="$PRIMARY_ADMIN_EMAIL" <<'SQL'
          INSERT INTO "users" ("id", "email", "updatedAt")
          VALUES (:'admin_id', :'admin_email', CURRENT_TIMESTAMP);
          SQL
          unset PRIMARY_ADMIN_EMAIL SYNTHETIC_ADMIN_ID
          GEO_PRISMA_DIR="$RUNNER_TEMP/prisma-before-geo-master-data"
          mkdir -p "$GEO_PRISMA_DIR/migrations"
          cp prisma/schema.prisma "$GEO_PRISMA_DIR/schema.prisma"
          cp prisma/migrations/migration_lock.toml "$GEO_PRISMA_DIR/migrations/migration_lock.toml"
          python3 - "$GEO_PRISMA_DIR/migrations" <<'PY'
          import pathlib, shutil, sys
          source = pathlib.Path("prisma/migrations")
          target = pathlib.Path(sys.argv[1])
          cutoff = "20260930163000_backfill_ghaziabad_city"
          copied = []
          for migration in sorted(p for p in source.iterdir() if p.is_dir() and p.name < cutoff):
              shutil.copytree(migration, target / migration.name)
              copied.append(migration.name)
          if "20260830215000_ensure_primary_platform_admin" not in copied:
              raise SystemExit("Geo fixture prefix must include the primary-admin migration.")
          print(f"Applying {len(copied)} migrations before the geo master-data repair.")
          PY
          npx prisma migrate deploy --schema "$GEO_PRISMA_DIR/schema.prisma"
          SYNTHETIC_COUNTRY_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          SYNTHETIC_REGION_ID="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          psql -h 127.0.0.1 -p 5432 --username "$(id -un)" --dbname fastque_screenshots -v ON_ERROR_STOP=1 -q -v country_id="$SYNTHETIC_COUNTRY_ID" -v region_id="$SYNTHETIC_REGION_ID" <<'SQL'
          INSERT INTO "Country" ("id", "isoCode2", "isoCode3", "name", "slug", "hasSubdivisions")
          VALUES (:'country_id', 'IN', 'IND', 'India', 'india', true)
          ON CONFLICT ("isoCode2") DO NOTHING;
          INSERT INTO "Region" ("id", "countryId", "code", "name", "slug")
          SELECT :'region_id', c."id", 'IN-UP', 'Uttar Pradesh', 'uttar-pradesh'
            FROM "Country" c
           WHERE c."isoCode2" = 'IN'
          ON CONFLICT ("countryId", "slug") DO NOTHING;
          SQL
          unset SYNTHETIC_COUNTRY_ID SYNTHETIC_REGION_ID
          npm run prisma:migrate:deploy --workspace=@barbercue/backend
          if ! npm run db:seed --workspace=@barbercue/backend > "$RUNNER_TEMP/seed-output-private.txt" 2>&1; then
            echo "Synthetic seed failed. Seed output is intentionally not printed or uploaded."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/seed-output-private.txt"
          psql -h 127.0.0.1 -p 5432 --username "$(id -un)" --dbname fastque_screenshots -v ON_ERROR_STOP=1 -q <<'SQL'
          UPDATE "salons"
             SET "name" = 'FastQue Demo Studio',
                 "phone" = NULL
           WHERE "slug" = 'barbercue-demo';
          UPDATE "users"
             SET "email" = regexp_replace("email", '@barbercue-demo[.]com$', '@fastque.demo.invalid'),
                 "phone" = NULL,
                 "phoneVerifiedAt" = NULL
           WHERE "email" LIKE '%@barbercue-demo.com';
          SQL
          SCREENSHOT_OWNER_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$SCREENSHOT_OWNER_PASSWORD"
          export SCREENSHOT_OWNER_PASSWORD
          if ! node <<'NODE' >/dev/null 2>&1
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcrypt');
          (async () => {
            const prisma = new PrismaClient();
            try {
              await prisma.user.update({
                where: { email: 'owner@fastque.demo.invalid' },
                data: { passwordHash: await bcrypt.hash(process.env.SCREENSHOT_OWNER_PASSWORD, 12) },
              });
            } finally {
              await prisma.$disconnect();
            }
          })().catch(() => process.exit(1));
          NODE
          then
            echo "Could not set an ephemeral synthetic owner login."
            exit 1
          fi
          printf 'SCREENSHOT_OWNER_PASSWORD=%s\n' "$SCREENSHOT_OWNER_PASSWORD" >> "$GITHUB_ENV"
          unset SCREENSHOT_OWNER_PASSWORD
          echo "Synthetic data is isolated to the runner-local database."
      - name: Start backend bound to the local synthetic database
        run: |
          set -euo pipefail
          export JWT_ACCESS_SECRET="$(openssl rand -hex 32)"
          export TOTP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export OTP_HASH_SECRET="$(openssl rand -hex 32)"
          npm run start:prod --workspace=@barbercue/backend > "$RUNNER_TEMP/fastque-backend-private.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fastque-backend.pid"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Local synthetic backend did not become healthy; backend logs are not uploaded."
            exit 1
          fi
          echo "Local synthetic backend health check passed."

      - name: Run mobile typecheck and complete Jest suite
        run: |
          set -euo pipefail
          npm run typecheck --workspace=@barbercue/mobile
          npm run test --workspace=@barbercue/mobile -- --runInBand

      - name: Generate standalone iOS simulator project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Disable OTA and build the Release simulator app
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          EXPO_PLIST="$(find ios -name Expo.plist -type f -print -quit)"
          test -n "$EXPO_PLIST"
          /usr/libexec/PlistBuddy -c 'Set :EXUpdatesEnabled false' "$EXPO_PLIST" \
            || /usr/libexec/PlistBuddy -c 'Add :EXUpdatesEnabled bool false' "$EXPO_PLIST"
          set -o pipefail
          xcodebuild \
            -workspace ios/FastQue.xcworkspace \
            -scheme FastQue \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- \
            build | tee "$RUNNER_TEMP/xcodebuild-simulator.log"

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/FastQue.app"
          SIGNATURE_INFO="$RUNNER_TEMP/fastque-simulator-signature.txt"
          codesign -dv --verbose=2 "$APP_PATH" 2> "$SIGNATURE_INFO"
          grep -F 'Identifier=com.dcw.fastque' "$SIGNATURE_INFO"
          grep -F 'Signature=adhoc' "$SIGNATURE_INFO"
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/fastque-simulator-entitlements.plist" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/fastque-simulator-entitlements.plist" <<'PY'
          import pathlib, plistlib, sys
          path = pathlib.Path(sys.argv[1])
          try:
              entitlements = plistlib.loads(path.read_bytes())
          except Exception:
              entitlements = {}
          keys = sorted(entitlements)
          print("Ad-hoc simulator entitlements: " + (", ".join(keys) if keys else "(none embedded)"))
          PY

      - name: Install Maestro and select eligible simulators
        run: |
          set -euo pipefail
          brew install mobile-dev-inc/tap/maestro
          maestro --version
          python3 <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"], text=True
          ))["devices"]
          rows = [d for group in devices.values() for d in group if d.get("isAvailable")]
          iphones = [d for d in rows if d.get("name", "").startswith(("iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro"))]
          ipads = [d for d in rows if d.get("name", "").startswith("iPad Pro 13-inch")]
          if not iphones:
              raise SystemExit("No supported Dynamic Island iPhone Pro simulator is available.")
          if not ipads:
              raise SystemExit("No 13-inch iPad Pro simulator is available.")
          preferred_iphone = next((d for prefix in ("iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro") for d in iphones if d["name"].startswith(prefix)), iphones[0])
          preferred_ipad = next((d for d in ipads if "(M4)" in d["name"] or "(M5)" in d["name"]), ipads[0])
          print(f"IPHONE_UDID={preferred_iphone['udid']}")
          print(f"IPHONE_MODEL={preferred_iphone['name']}")
          print(f"IPAD_UDID={preferred_ipad['udid']}")
          print(f"IPAD_MODEL={preferred_ipad['name']}")
          PY
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/FastQue.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx com.dcw.fastque
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Set :NSAppTransportSecurity:NSAllowsLocalNetworking true' "$APP_PATH/Info.plist" 2>/dev/null             || /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP_PATH/Info.plist" | grep -Fx true
          echo "Simulator-only local HTTP exception applied; release source is unchanged."

      - name: Build genuine iPhone and iPad App Store screenshots
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/FastQue.app"
          mkdir -p "$RUNNER_TEMP/fastque-maestro" "$RUNNER_TEMP/maestro-captures" screenshot-artifact
          xcrun simctl boot "$IPHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          xcrun simctl status_bar "$IPHONE_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$IPHONE_UDID" "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/fastque-maestro/iphone"
          cat > "$RUNNER_TEMP/fastque-maestro/iphone/release-screens.yaml" <<'YAML'
          appId: com.dcw.fastque
          ---
          - launchApp:
              clearState: true
          - extendedWaitUntil:
              visible: "Search"
              timeout: 90000
          - assertVisible: "Find barber"
          - takeScreenshot: iphone-customer-home
          - tapOn: "Search"
          - extendedWaitUntil:
              visible: "Find a salon"
              timeout: 30000
          - tapOn: "Search services…"
          - inputText: "Haircut"
          - tapOn:
              text: "Continue"
              optional: true
          - pressKey: Enter
          - extendedWaitUntil:
              visible:
                text: ".*FastQue Demo Studio.*"
              timeout: 45000
          - assertVisible:
              text: ".*FastQue Demo Studio.*"
          - takeScreenshot: iphone-salon-search
          - tapOn: ".*FastQue Demo Studio.*"
          - extendedWaitUntil:
              visible: "LIVE SHOP SNAPSHOT"
              timeout: 30000
          - takeScreenshot: iphone-salon-profile
          - scrollUntilVisible:
              element:
                text: 'Haircut(?! \+).*'
              direction: DOWN
              timeout: 30000
          - tapOn: 'Haircut(?! \+).*'
          - scrollUntilVisible:
              element:
                text: "Continue"
              direction: DOWN
              timeout: 30000
          - tapOn: "Continue"
          - extendedWaitUntil:
              visible: "Choose a barber"
              timeout: 30000
          - takeScreenshot: iphone-booking-staff-selection
          # Navigating back to the salon page freezes later navigation at this app SHA (known RN
          # defect), so start a fresh session and open the salon straight into the walk-in queue.
          - launchApp:
              clearState: true
          - extendedWaitUntil:
              visible: "Search"
              timeout: 90000
          - tapOn: "Search"
          - extendedWaitUntil:
              visible: "Find a salon"
              timeout: 30000
          - tapOn: "Search services…"
          - inputText: "Haircut"
          - tapOn:
              text: "Continue"
              optional: true
          - pressKey: Enter
          - extendedWaitUntil:
              visible:
                text: ".*FastQue Demo Studio.*"
              timeout: 45000
          - tapOn: ".*FastQue Demo Studio.*"
          - extendedWaitUntil:
              visible: "LIVE SHOP SNAPSHOT"
              timeout: 30000
          # The button exists in the hierarchy while still below the fold, so force it to the centre
          # of the viewport before tapping (an off-screen tap silently does nothing).
          - scrollUntilVisible:
              element:
                text: "Join queue now"
              direction: DOWN
              centerElement: true
              timeout: 30000
          - waitForAnimationToEnd
          - tapOn:
              text: "Join queue now"
              retryTapIfNoChange: true
          - extendedWaitUntil:
              visible: "Join the queue"
              timeout: 30000
          - takeScreenshot: iphone-live-queue-join
          - launchApp:
              clearState: true
          - extendedWaitUntil:
              visible: "Search"
              timeout: 90000
          - tapOn: "Menu"
          - tapOn: "Shop Owner.*"
          - extendedWaitUntil:
              visible: "you@example.com"
              timeout: 30000
          - tapOn: "you@example.com"
          - inputText: "owner@fastque.demo.invalid"
          # The open keyboard covers the password field (a tap there lands on a key and types into the
          # email box), so close it first. Maestro only substitutes MAESTRO_-prefixed environment variables.
          - hideKeyboard
          - waitForAnimationToEnd
          - tapOn: "••••••••"
          - inputText: "${MAESTRO_SCREENSHOT_OWNER_PASSWORD}"
          # hideKeyboard cannot close the secure-entry keyboard (iOS shows the Passwords bar there);
          # Return blurs the single-line password field, which closes the keyboard.
          - pressKey: Enter
          - waitForAnimationToEnd
          # index 0 is the navigation-bar title; index 1 is the Sign in button.
          - tapOn:
              text: "Sign in"
              index: 1
          - extendedWaitUntil:
              visible: ".*FastQue Demo Studio.*"
              timeout: 60000
          # iOS offers "Save Password?" after a password sign-in; it covers the screen (run 43509667212).
          - extendedWaitUntil:
              visible: "Not Now"
              timeout: 10000
              optional: true
          - tapOn:
              text: "Not Now"
              optional: true
          - waitForAnimationToEnd
          - takeScreenshot: iphone-owner-dashboard
          - tapOn: "Bookings"
          - extendedWaitUntil:
              visible: "Bookings"
              timeout: 30000
          - takeScreenshot: iphone-owner-bookings
          - tapOn: "Queue"
          - extendedWaitUntil:
              visible: "Queue"
              timeout: 30000
          - takeScreenshot: iphone-owner-live-queue
          - tapOn: "Shop"
          - extendedWaitUntil:
              visible: "Services"
              timeout: 30000
          - takeScreenshot: iphone-owner-shop
          YAML
          cd "$RUNNER_TEMP/fastque-maestro/iphone"
          DIAGNOSTIC_DIR="$GITHUB_WORKSPACE/fastque-simulator-failure"
          mkdir -p "$DIAGNOSTIC_DIR"
          run_maestro_flow() {
            local device_name="$1"
            local device_udid="$2"
            local flow_path="$3"
            local output_dir="$4"
            local log_path="$RUNNER_TEMP/maestro-$device_name.log"
          
            mkdir -p "$output_dir" "$DIAGNOSTIC_DIR"
            # A crashed XCTest driver (viewHierarchy HTTP 500) can leave Maestro hung until the job
            # timeout. Cap each attempt at 25 minutes and retry the whole flow once from a clean state.
            local status=1
            local attempt
            for attempt in 1 2; do
              rm -rf "$output_dir"; mkdir -p "$output_dir"
              set +e
              MAESTRO_SCREENSHOT_OWNER_PASSWORD="${SCREENSHOT_OWNER_PASSWORD:-}" perl -e 'alarm shift; exec @ARGV' 1500 maestro --device "$device_udid" test --test-output-dir "$output_dir" "$flow_path" 2>&1 | tee "$log_path"
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" -eq 0 ] && break
              echo "Maestro attempt $attempt on $device_name failed with status $status"
              # Leave the final failed screen in place for the failure diagnostics capture.
              if [ "$attempt" -lt 2 ]; then xcrun simctl terminate "$device_udid" com.dcw.fastque >/dev/null 2>&1 || true; fi
            done
            if [ "$status" -ne 0 ]; then
              printf '%s\n' "$device_name" > "$RUNNER_TEMP/fastque-maestro-failed-device"
              python3 - "$log_path" "$device_name" <<'PY' > "$DIAGNOSTIC_DIR/maestro-failure-summary.txt"
          import os, pathlib, re, sys
          source = pathlib.Path(sys.argv[1])
          lines = source.read_text(errors="replace").splitlines() if source.exists() else []
          text = "\n".join(lines[-100:])
          password = os.environ.get("SCREENSHOT_OWNER_PASSWORD", "")
          if password:
              text = text.replace(password, "[synthetic password redacted]")
          patterns = [
              (re.compile(r"(?i)\b[\w.+-]+@[\w.-]+\.[a-z]{2,}\b"), "[email redacted]"),
              (re.compile(r"(?i)\bbearer\s+[a-z0-9._~-]+"), "Bearer [redacted]"),
              (re.compile(r"(?i)\b[0-9a-f]{32,}\b"), "[long token redacted]"),
              (re.compile(r"\b\+?[0-9][0-9 ()-]{7,}[0-9]\b"), "[phone redacted]"),
          ]
          for pattern, replacement in patterns:
              text = pattern.sub(replacement, text)
          print(f"Failed simulator flow: {sys.argv[2]}")
          print("Sanitized final Maestro output (maximum 100 lines):")
          print(text)
          PY
              exit "$status"
            fi
          }
          run_maestro_flow iphone "$IPHONE_UDID" "$RUNNER_TEMP/fastque-maestro/iphone/release-screens.yaml" "$RUNNER_TEMP/maestro-captures/iphone"
          mkdir -p "$RUNNER_TEMP/fastque-maestro/ipad"
          cat > "$RUNNER_TEMP/fastque-maestro/ipad/release-screens.yaml" <<'YAML'
          appId: com.dcw.fastque
          ---
          - launchApp:
              clearState: true
          - extendedWaitUntil:
              visible: "Search"
              timeout: 90000
          - assertVisible: "Find a barber"
          - takeScreenshot: ipad-13-customer-home
          - tapOn: "Search"
          - extendedWaitUntil:
              visible: "Find a salon"
              timeout: 30000
          - tapOn: "Search services…"
          - inputText: "Haircut"
          - tapOn:
              text: "Continue"
              optional: true
          - pressKey: Enter
          - extendedWaitUntil:
              visible:
                text: ".*FastQue Demo Studio.*"
              timeout: 45000
          - assertVisible:
              text: ".*FastQue Demo Studio.*"
          - takeScreenshot: ipad-13-salon-search
          YAML
          cd "$RUNNER_TEMP/fastque-maestro/ipad"
          xcrun simctl boot "$IPAD_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD_UDID" -b
          xcrun simctl status_bar "$IPAD_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$IPAD_UDID" "$APP_PATH"
          run_maestro_flow ipad "$IPAD_UDID" "$RUNNER_TEMP/fastque-maestro/ipad/release-screens.yaml" "$RUNNER_TEMP/maestro-captures/ipad"
          mkdir -p fastque-simulator-failure
          python3 - "$RUNNER_TEMP/maestro-captures" <<'PY' > "$GITHUB_WORKSPACE/fastque-simulator-failure/capture-inventory.txt"
          import pathlib, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(root.rglob("*.png")) if root.exists() else []
          print(f"Captured PNG count: {len(files)}")
          for path in files:
              try:
                  result = subprocess.check_output(["sips", "-g", "pixelWidth", "-g", "pixelHeight", path.as_posix()], text=True)
                  values = {}
                  for line in result.splitlines():
                      if ":" in line:
                          key, value = line.strip().split(":", 1)
                          values[key.strip()] = value.strip()
                  print(f"{path.name}: {values.get('pixelWidth', '?')}x{values.get('pixelHeight', '?')}")
              except Exception as error:
                  print(f"{path.name}: dimensions unavailable ({type(error).__name__})")
          PY
          find "$RUNNER_TEMP/maestro-captures" -type f -name '*.png' -print
          screenshot_count="$(find "$RUNNER_TEMP/maestro-captures" -type f -name '*.png' | wc -l | tr -d ' ')"
          echo "Validated-flow screenshot count before conversion: $screenshot_count"
          test "$screenshot_count" -ge 11
          while IFS= read -r image; do
            name="$(basename "$image" .png)"
            sips -s format jpeg -s formatOptions 92 "$image" --out "screenshot-artifact/$name.jpg" >/dev/null
          # Only the named App Store captures; Maestro's own step-NNN debug images (same name on
          # iPhone and iPad) collided here in run 43514708195.
          done < <(find "$RUNNER_TEMP/maestro-captures" -type f \( -name 'iphone-*.png' -o -name 'ipad-13-*.png' \) -print)
          python3 <<'PY'
          import os, subprocess, sys
          files = sorted(f for f in os.listdir("screenshot-artifact") if f.lower().endswith(".jpg"))
          if len(files) < 10:
              raise SystemExit(f"Expected at least 10 JPEG screenshots, found {len(files)}")
          for name in files:
              path = os.path.join("screenshot-artifact", name)
              result = subprocess.check_output(["sips", "-g", "pixelWidth", "-g", "pixelHeight", "-g", "format", path], text=True)
              values = {}
              for line in result.splitlines():
                  if ":" in line:
                      key, value = line.strip().split(":", 1)
                      values[key.strip()] = value.strip()
              if values.get("format") != "jpeg":
                  raise SystemExit(f"{name} is not a JPEG.")
              width, height = int(values["pixelWidth"]), int(values["pixelHeight"])
              if name.startswith("iphone-") and (width, height) not in {(1179, 2556), (1206, 2622), (1260, 2736)}:
                  raise SystemExit(f"Unsupported iPhone screenshot dimensions for {name}: {width}x{height}")
              if name.startswith("ipad-13-") and (width, height) != (2064, 2752):
                  raise SystemExit(f"Unsupported 13-inch iPad screenshot dimensions for {name}: {width}x{height}")
              print(f"{name}: {width}x{height} JPEG (opaque; JPEG has no alpha channel)")
          with open("screenshot-artifact/capture-manifest.txt", "w", encoding="utf-8") as out:
              out.write(f"Application source SHA: {os.environ['APP_SOURCE_SHA']}\n")
              out.write(f"iPhone Simulator: {os.environ['IPHONE_MODEL']}\n")
              out.write(f"iPad Simulator: {os.environ['IPAD_MODEL']}\n")
              out.write("Backend: runner-local disposable PostgreSQL; synthetic salon/users only\n")
              out.write("JPEG screenshots are opaque and contain no alpha channel.\n")
          PY

      - name: Capture simulator screen and startup diagnostics for failed UI diagnosis
        if: failure() && env.IPHONE_UDID != ''
        run: |
          set -euo pipefail
          mkdir -p fastque-simulator-failure
          device_name="iphone"
          device_udid="$IPHONE_UDID"
          if [ -f "$RUNNER_TEMP/fastque-maestro-failed-device" ]; then
            device_name="$(cat "$RUNNER_TEMP/fastque-maestro-failed-device")"
            if [ "$device_name" = "ipad" ] && [ -n "$IPAD_UDID" ]; then
              device_udid="$IPAD_UDID"
            fi
          fi
          screenshot="fastque-simulator-failure/$device_name-failure-screen.png"
          xcrun simctl io "$device_udid" screenshot "$screenshot"
          sips -g pixelWidth -g pixelHeight -g format "$screenshot"

          cat > "$RUNNER_TEMP/fastque-screen-ocr.swift" <<'SWIFT'
          import Foundation
          import Vision
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1]), options: [:]).perform([request])
          for observation in request.results ?? [] {
            if let text = observation.topCandidates(1).first?.string { print(text) }
          }
          SWIFT
          swift "$RUNNER_TEMP/fastque-screen-ocr.swift" "$screenshot" > "fastque-simulator-failure/$device_name-visible-ui-text.txt" 2>&1 || echo "Simulator screenshot OCR failed." > "fastque-simulator-failure/$device_name-visible-ui-text.txt"

          xcrun simctl spawn "$device_udid" log show --last 15m --style compact \
            --predicate 'process == "FastQue" AND (messageType == "error" OR messageType == "fault" OR eventMessage CONTAINS[c] "font" OR eventMessage CONTAINS[c] "SecureStore" OR eventMessage CONTAINS[c] "Unhandled" OR eventMessage CONTAINS[c] "ReactNative")' \
            > "$RUNNER_TEMP/fastque-focused-app-log.txt" 2>&1 || true
          python3 - "$RUNNER_TEMP/fastque-focused-app-log.txt" <<'PY'
          import pathlib, re, sys
          source = pathlib.Path(sys.argv[1])
          text = source.read_text(errors="replace") if source.exists() else ""
          lines = text.splitlines()
          redact = [
              (re.compile(r"(?i)\b[\w.+-]+@[\w.-]+\.[a-z]{2,}\b"), "[email redacted]"),
              (re.compile(r"(?i)bearer\s+[a-z0-9._~-]+"), "Bearer [redacted]"),
              (re.compile(r"(?i)\b[0-9a-f]{32,}\b"), "[long token redacted]"),
              (re.compile(r"\b\+?[0-9][0-9 ()-]{7,}[0-9]\b"), "[phone redacted]"),
          ]
          selected = lines[-100:]
          with open("fastque-simulator-failure/focused-runtime-diagnostics.txt", "w", encoding="utf-8") as out:
              out.write(f"Filtered app log lines: {len(lines)}; showing at most {len(selected)}.\n")
              for line in selected:
                  for pattern, replacement in redact:
                      line = pattern.sub(replacement, line)
                  out.write(line[:500] + "\n")
          PY

      - name: Upload failure-only simulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastque-simulator-failure-diagnostic
          retention-days: 2
          if-no-files-found: ignore
          path: fastque-simulator-failure/**

      - name: Upload only validated App Store screenshot candidates
        uses: actions/upload-artifact@v4
        with:
          name: fastque-appstore-genuine-screenshots
          retention-days: 7
          if-no-files-found: error
          path: screenshot-artifact/*

      - name: Scan simulator logs for fatal launch errors
        if: always()
        run: |
          set -euo pipefail
          iphone_udid="${IPHONE_UDID:-}"
          ipad_udid="${IPAD_UDID:-}"
          if [ -z "$iphone_udid" ] && [ -z "$ipad_udid" ]; then
            echo "Simulator selection did not complete; the earlier failing step remains the job failure."
            exit 0
          fi
          for udid in "$iphone_udid" "$ipad_udid"; do
            [ -n "$udid" ] || continue
            log_file="$RUNNER_TEMP/fastque-fatal-scan-$udid.log"
            xcrun simctl spawn "$udid" log show --last 20m --style compact --predicate 'process == "FastQue"' > "$log_file" 2>&1 || true
            if grep -E -i 'No script URL provided|Could not connect to development server|Unhandled JS Exception|RCTFatal|terminating app due to uncaught exception|EXC_CRASH|SIGABRT' "$log_file"; then
              echo "Fatal simulator log signature detected."
              exit 1
            fi
          done
