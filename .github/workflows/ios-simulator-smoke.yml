name: FastQue iOS Simulator Smoke

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ios-simulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    name: macOS iPhone Simulator build and cold launch
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: https://barbercuebackend-production.up.railway.app/api/v1
      FASTQUE_IOS_BUILD: "true"
      # Synthetic OAuth config exercises native URL-scheme generation only; it cannot authenticate.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 123456789012-test_client.apps.googleusercontent.com

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Apple toolchain
        run: |
          set -euxo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version
          npm --version
          pod --version

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck and test mobile workspace
        id: mobile-quality
        continue-on-error: true
        run: |
          npm run typecheck --workspace=@barbercue/mobile
          npm run test --workspace=@barbercue/mobile -- --runInBand

      - name: Generate the iOS native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Disable OTA for this standalone simulator smoke
        working-directory: apps/mobile
        run: |
          set -euxo pipefail
          EXPO_PLIST="$(find ios -name Expo.plist -type f -print -quit)"
          test -n "$EXPO_PLIST"
          /usr/libexec/PlistBuddy -c 'Set :EXUpdatesEnabled false' "$EXPO_PLIST" \
            || /usr/libexec/PlistBuddy -c 'Add :EXUpdatesEnabled bool false' "$EXPO_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :EXUpdatesEnabled' "$EXPO_PLIST"

      - name: Build standalone Release simulator app
        working-directory: apps/mobile
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/FastQue.xcworkspace \
            -scheme FastQue \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild-simulator.log"

      - name: Verify bundle and launch on an iPhone Simulator
        id: simulator
        run: |
          set -euxo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/FastQue.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" | grep -Fx com.dcw.fastque
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist"
          find "$APP_PATH" -type f \( -name main.jsbundle -o -name '*.jsbundle' \) -size +0c -print -quit | grep .
          DEVICE_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; rows=[x for runtime in d.values() for x in runtime if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(rows[0]["udid"] if rows else "")')"
          test -n "$DEVICE_UDID"
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl terminate "$DEVICE_UDID" com.dcw.fastque || true
          xcrun simctl launch "$DEVICE_UDID" com.dcw.fastque
          sleep 15
          xcrun simctl get_app_container "$DEVICE_UDID" com.dcw.fastque app
          xcrun simctl io "$DEVICE_UDID" screenshot "$RUNNER_TEMP/fastque-ios-simulator.png"

      - name: Scan simulator logs for fatal launch errors
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          set -euxo pipefail
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" log show \
            --last 10m --style compact --predicate 'process == "FastQue"' \
            > "$RUNNER_TEMP/fastque-simulator.log" 2>&1 || true
          grep -E -i 'No script URL provided|Could not connect to development server|Unhandled JS Exception|RCTFatal|terminating app due to uncaught exception|EXC_CRASH|SIGABRT' \
            "$RUNNER_TEMP/fastque-simulator.log" > "$RUNNER_TEMP/fatal-scan.txt" || true
          test -f "$RUNNER_TEMP/fastque-ios-simulator.png"
          test ! -s "$RUNNER_TEMP/fatal-scan.txt"

      - name: Upload non-sensitive simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastque-ios-simulator-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/xcodebuild-simulator.log
            ${{ runner.temp }}/fastque-ios-simulator.png
            ${{ runner.temp }}/fatal-scan.txt

      - name: Keep mobile test failures blocking
        if: always() && steps.mobile-quality.outcome == 'failure'
        run: |
          echo "The mobile typecheck or full Jest suite failed; see the earlier step for details."
          exit 1
