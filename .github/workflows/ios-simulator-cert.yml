name: FastQue iOS simulator certification

on:
  push:
    branches:
      - chatgpt/fastque-ios-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastque-ios-simulator-cert
  cancel-in-progress: true

jobs:
  certify-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_FASTQUE_CREDITS_ENABLED: "true"
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: "871155185690-bcl6bu22nphvg85hklflag78sqfp7khv.apps.googleusercontent.com"
      # Build-only non-production client shape so the config plugin can generate the native callback
      # scheme. Real iOS Google OAuth remains separately blocked until the actual Google iOS client
      # for com.dcw.fastque is created and supplied.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: "000000000000-fastque-ios-simulator.apps.googleusercontent.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Mobile typecheck
        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Mobile tests
        run: npm test --workspace=@barbercue/mobile -- --runInBand

      - name: Resolve Expo config
        working-directory: apps/mobile
        run: npx expo config --type prebuild > /tmp/fastque-expo-config.txt

      - name: Export iOS JavaScript bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir dist-ios-cert

      - name: Generate iOS native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned iOS Simulator app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$WORKSPACE" ]]; then
            echo "No .xcworkspace generated" >&2
            exit 1
          fi
          SCHEME="FastQue"
          if ! xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "FastQue" in d["workspace"]["schemes"]'; then
            echo "FastQue app scheme not found in workspace" >&2
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          echo "workspace=$WORKSPACE"
          echo "scheme=$SCHEME"
          xcodebuild             -workspace "$WORKSPACE"             -scheme "$SCHEME"             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath ios-derived             CODE_SIGNING_ALLOWED=NO             build
          APP_PATH="$(find ios-derived/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Simulator .app not found after successful xcodebuild" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" fastque-ios-simulator.zip

      - name: Launch on iOS Simulator
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find ios-derived/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Simulator .app not found" >&2
            exit 1
          fi
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); candidates=[x for arr in d["devices"].values() for x in arr if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; assert candidates, "No available iPhone simulator"; print(candidates[0]["udid"])')"
          echo "simulator=$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch "$UDID" com.dcw.fastque)"
          echo "$LAUNCH_OUTPUT"
          sleep 8
          xcrun simctl io "$UDID" screenshot fastque-ios-simulator-launch.png
          test -s fastque-ios-simulator-launch.png
          xcrun simctl terminate "$UDID" com.dcw.fastque
          xcrun simctl shutdown "$UDID"

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastque-ios-simulator
          path: |
            apps/mobile/fastque-ios-simulator.zip
            apps/mobile/fastque-ios-simulator-launch.png
          if-no-files-found: error
          retention-days: 7
