name: Publish Preview OTA Once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-preview-ota-once.yml"

permissions:
  contents: read

jobs:
  publish-preview-ota:
    runs-on: ubuntu-latest
    env:
      CI: 1
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_BASE_URL: https://barbercuebackend-production.up.railway.app/api/v1
      EXPO_PUBLIC_WEB_ORIGIN: https://barbercueweb-production.up.railway.app
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 871155185690-bcl6bu22nphvg85hklflag78sqfp7khv.apps.googleusercontent.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 871155185690-0256keu32669iup0b8vbi20junds6d0f.apps.googleusercontent.com
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shared TypeScript
        run: npm run typecheck --workspace=@barbercue/shared

      - name: Verify mobile TypeScript
        run: npm run typecheck --workspace=@barbercue/mobile

      - name: Publish Android OTA to preview channel
        working-directory: apps/mobile
        run: npx eas-cli@latest update --channel preview --platform android --non-interactive --message "PR #7 production sync — salon status and explicit slot availability (41d0044)"
