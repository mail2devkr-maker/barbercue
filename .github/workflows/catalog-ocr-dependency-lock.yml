name: Prepare OCR dependencies (temporary)
on:
  push:
    branches: [fix/catalog-import-recovery-20261013]
    paths:
      - '.github/workflows/catalog-ocr-dependency-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'mail2devkr-maker/barbercue'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/catalog-import-recovery-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned browser OCR and PDF reader dependencies into lockfile
        run: npm install --workspace=@barbercue/web --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund tesseract.js@6.0.1 pdfjs-dist@5.4.296
      - name: Commit only dependency manifest and lockfile to this branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/package.json package-lock.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m "chore(catalog): lock local OCR and PDF reader dependencies"
          git push origin HEAD:refs/heads/fix/catalog-import-recovery-20261013
