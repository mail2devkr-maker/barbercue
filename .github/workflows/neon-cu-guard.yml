name: Neon CU guard

# Watches Neon compute (CU-hours) for the live FastQue database every day and, when the live project
# passes 90% of its monthly allowance, moves production to the other FastQue project between
# 00:00 and 06:00 IST. Runs in GitHub's cloud: no local machine has to be awake.
# Setup and runbook: scripts/ops/neon-cu-guard/README.md
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily report
    # Switch window 00:00-06:00 IST (= 18:30-00:30 UTC). GitHub runs these late and skips many, so the
    # checks are frequent; the script enforces the window (and switches at once only when urgent).
    - cron: "*/15 18-23 * * *"
    - cron: "*/15 0 * * *"
    # Daytime safety checks (auto mode): act only if the allowance would run out before the next night.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = normal run; report = post usage now; rehearse = full copy test on the test projects + read-only production probes"
        type: choice
        options: [auto, report, rehearse]
        default: report

permissions:
  contents: read
  issues: write

concurrency:
  group: neon-cu-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      NEON_GUARD_AUTOSWITCH: ${{ vars.NEON_GUARD_AUTOSWITCH }}
      GITHUB_TOKEN: ${{ github.token }}
      GUARD_MODE: ${{ inputs.mode || (github.event.schedule == '30 3 * * *' && 'report') || 'auto' }}
    steps:
      - name: Secrets present?
        id: secrets
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::NEON_API_KEY / RAILWAY_TOKEN are not set yet - see scripts/ops/neon-cu-guard/README.md. Nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          sparse-checkout: scripts/ops/neon-cu-guard

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Decision logic tests (a failing test stops the guard before it can act)
        if: steps.secrets.outputs.ready == 'true'
        run: node --test scripts/ops/neon-cu-guard/lib.test.mjs

      - name: PostgreSQL 18 client tools
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get install -y -q postgresql-common >/dev/null \
              && sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null \
              && sudo apt-get install -y -q postgresql-client-18 >/dev/null && break
            sleep 20
          done
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Guard
        if: steps.secrets.outputs.ready == 'true'
        run: |
          pg_dump --version
          node scripts/ops/neon-cu-guard/guard.mjs
