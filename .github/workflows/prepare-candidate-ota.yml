name: Prepare Candidate OTA Support

on:
  push:
    branches:
      - test/push-e2e-launch-candidate
    paths:
      - .github/workflows/prepare-candidate-ota.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install expo-updates and synchronize lockfile
        run: npm install --workspace=@barbercue/mobile expo-updates@~57.0.19 --save

      - name: Configure EAS Update without disturbing push/Firebase config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const appPath = 'apps/mobile/app.json';
          const app = JSON.parse(fs.readFileSync(appPath, 'utf8'));
          app.expo.version = '1.0.1';
          app.expo.runtimeVersion = { policy: 'appVersion' };
          app.expo.updates = {
            url: 'https://u.expo.dev/01998c87-126d-40e8-aac3-205891b74b08',
            checkAutomatically: 'ON_LOAD',
            fallbackToCacheTimeout: 2000,
          };
          fs.writeFileSync(appPath, JSON.stringify(app, null, 2) + '\n');

          const easPath = 'apps/mobile/eas.json';
          const eas = JSON.parse(fs.readFileSync(easPath, 'utf8'));
          eas.build.preview.channel = 'preview';
          eas.build.preview.autoIncrement = true;
          eas.build.production.channel = 'production';
          eas.build.production.autoIncrement = true;
          fs.writeFileSync(easPath, JSON.stringify(eas, null, 2) + '\n');
          NODE

      - name: Commit candidate OTA support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/app.json apps/mobile/eas.json package-lock.json
          if git diff --cached --quiet; then
            echo "Candidate OTA support already synchronized."
            exit 0
          fi
          git commit -m "fix(mobile): enable OTA updates on launch candidate"
          git push
