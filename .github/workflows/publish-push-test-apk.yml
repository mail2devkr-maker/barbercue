name: Publish Push Test APK

on:
  push:
    branches:
      - test/push-physical-transport
    paths:
      - .github/workflows/publish-push-test-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: push-physical-test-standalone-20260901
      SOURCE_RUN_ID: "33433299771"
      ARTIFACT_NAME: barbercue-push-transport-standalone-apk
    steps:
      - name: Download exact successful standalone APK artifact
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist
          test -f dist/app-release.apk
          mv dist/app-release.apk dist/barbercue-push-physical-test-standalone.apk

      - name: Publish temporary standalone prerelease
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/barbercue-push-physical-test-standalone.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target test/push-physical-transport \
            --prerelease \
            --title "BarberCue Physical Push Test — Standalone" \
            --notes "Temporary standalone RELEASE Android APK with embedded JS for BarberCue FCM/Expo physical push transport verification. Not a production release."
