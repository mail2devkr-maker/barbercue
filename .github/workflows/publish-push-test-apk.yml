name: Publish Push Test APK

on:
  push:
    branches:
      - test/push-physical-transport
    paths:
      - .github/workflows/publish-push-test-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: push-physical-test-diagnostic-arm64-20260901
      SOURCE_RUN_ID: "33439033510"
      ARTIFACT_NAME: barbercue-push-transport-standalone-apk
    steps:
      - name: Download exact successful diagnostic APK artifact
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist
          test -f dist/app-release.apk
          mv dist/app-release.apk dist/barbercue-push-diagnostic-arm64.apk

      - name: Publish temporary diagnostic prerelease
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/barbercue-push-diagnostic-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target test/push-physical-transport \
            --prerelease \
            --title "BarberCue Physical Push Test — Diagnostic arm64" \
            --notes "Temporary arm64 RELEASE diagnostic APK. It renders the physical push-test screen first and then lazy-loads Expo notifications so startup/push errors are surfaced in-app. Not a production release."
