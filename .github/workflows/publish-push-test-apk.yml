name: Publish Push Test APK

on:
  push:
    branches:
      - test/push-physical-transport
    paths:
      - .github/workflows/publish-push-test-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: push-physical-test-20260901
      SOURCE_RUN_ID: "33430183012"
      ARTIFACT_NAME: barbercue-push-transport-debug-apk
    steps:
      - name: Download exact successful APK artifact
        run: |
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist
          test -f dist/app-debug.apk
          mv dist/app-debug.apk dist/barbercue-push-physical-test.apk

      - name: Publish temporary prerelease
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            dist/barbercue-push-physical-test.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target test/push-physical-transport \
            --prerelease \
            --title "BarberCue Physical Push Test" \
            --notes "Temporary standalone Android APK for BarberCue FCM/Expo physical push transport verification. Not a production release."
