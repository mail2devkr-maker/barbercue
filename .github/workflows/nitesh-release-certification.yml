name: Nitesh Admin + Discovery Release Gate

# Independent, strict certification of the reviewed combined candidate.
# No production endpoints, user credentials, or deployment publishing.
on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/web/**'
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - '.github/workflows/nitesh-release-certification.yml'
  push:
    branches:
      - 'integration/nitesh-admin-discovery-*'

permissions:
  contents: read

concurrency:
  group: nitesh-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      CHAIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/nitesh_gate?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run prisma:generate --workspace=@barbercue/backend
      - run: npm run typecheck --workspace=@barbercue/backend
      - name: Verify entire migration chain on disposable PostgreSQL
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE nitesh_gate"
          cd apps/backend
          DATABASE_URL="$CHAIN_DATABASE_URL" bash scripts/verify-migration-chain.sh
      - name: Cross-PR additive DDL coexistence (synthetic database, pinned sources)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_migration() {
            local sha="$1" folder="$2" outfile="$3"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/mail2devkr-maker/barbercue/contents/apps/backend/prisma/migrations/$folder/migration.sql?ref=$sha" \
              -o "$outfile"
          }
          fetch_migration "3e9b533ffeddf7d9c2edc24c1b1cd07bb04990c8" "20261027100000_add_apple_auth" "$RUNNER_TEMP/apple.sql"
          fetch_migration "33b9f0017a32242f84d94414b227e1a32e01a238" "20261027100000_salon_change_requests" "$RUNNER_TEMP/shop-change.sql"
          fetch_migration "e33f1aad99e3710d79af5ca77243952a60419f71" "20261027140000_owner_transfer_password_gate" "$RUNNER_TEMP/owner-transfer.sql"
          cmp --silent "$RUNNER_TEMP/apple.sql" apps/backend/prisma/migrations/20261027100000_add_apple_auth/migration.sql || {
            echo "Pinned PR #315 Apple migration differs from the migration already applied by the full chain" >&2
            exit 1
          }
          # The full candidate migration chain above has already applied this exact Apple DDL.
          # Re-running it would be a duplicate-application test, not a coexistence test.
          # Keep it in the pinned-source comparison, then apply only the two not-yet-integrated
          # additive migrations to the same migrated database so PostgreSQL validates coexistence.
          psql -d nitesh_gate -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/shop-change.sql"
          psql -d nitesh_gate -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/owner-transfer.sql"
          psql -d nitesh_gate -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid
              WHERE t.typname = 'AuthProvider' AND e.enumlabel = 'APPLE'
            ) OR NOT EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'auth_identities'
                AND column_name = 'provider_refresh_token_encrypted'
            ) OR to_regclass('public.apple_auth_nonces') IS NULL THEN
              RAISE EXCEPTION 'Integrated Apple-auth schema is missing after the complete migration chain';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'apple_auth_nonces_expires_at_idx') THEN
              RAISE EXCEPTION 'Integrated Apple-auth expiry index is missing';
            END IF;

            IF to_regclass('public.salon_change_requests') IS NULL
              OR to_regclass('public.salon_owner_transfers') IS NULL THEN
              RAISE EXCEPTION 'Cross-PR additive tables are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'users'
                AND column_name = 'passwordChangeRequired')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_schema = current_schema() AND table_name = 'users'
                AND column_name = 'temporaryPasswordExpiresAt') THEN
              RAISE EXCEPTION 'Owner-transfer password-gate columns are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_change_requests_salonId_field_pendingSlot_key'
              AND indexdef ILIKE 'CREATE UNIQUE INDEX%')
              OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_owner_transfers_salonId_openSlot_key'
              AND indexdef ILIKE 'CREATE UNIQUE INDEX%')
              OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_owner_transfers_invitationTokenHash_key'
              AND indexdef ILIKE 'CREATE UNIQUE INDEX%')
              OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_change_requests_salonId_status_requestedAt_idx')
              OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_change_requests_requestedByUserId_requestedAt_idx')
              OR NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname = current_schema()
              AND indexname = 'salon_owner_transfers_salonId_preparedAt_idx') THEN
              RAISE EXCEPTION 'Expected cross-PR indexes are missing or unique indexes lost uniqueness';
            END IF;
            IF (SELECT count(*) FROM pg_constraint
              WHERE conrelid = 'public.salon_change_requests'::regclass
                AND conname::text = ANY(ARRAY[
                  'salon_change_requests_pkey',
                  'salon_change_requests_value_check',
                  'salon_change_requests_pending_slot_check',
                  'salon_change_requests_decision_state_check',
                  'salon_change_requests_salonId_fkey',
                  'salon_change_requests_requestedByUserId_fkey',
                  'salon_change_requests_decidedByUserId_fkey'
                ])) <> 7
              OR (SELECT count(*) FROM pg_constraint
              WHERE conrelid = 'public.salon_owner_transfers'::regclass
                AND conname::text = ANY(ARRAY[
                  'salon_owner_transfers_pkey',
                  'salon_owner_transfers_open_slot_check',
                  'salon_owner_transfers_evidence_check',
                  'salon_owner_transfers_invited_check',
                  'salon_owner_transfers_completed_check',
                  'salon_owner_transfers_invitation_count_check',
                  'salon_owner_transfers_salonId_fkey',
                  'salon_owner_transfers_fromUserId_fkey',
                  'salon_owner_transfers_toUserId_fkey'
                ])) <> 9 THEN
              RAISE EXCEPTION 'Expected cross-PR primary, check, or foreign-key constraints are missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'public.salon_change_requests'::regclass
              AND conname = 'salon_change_requests_salonId_fkey' AND contype = 'f')
              OR NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'public.salon_owner_transfers'::regclass
              AND conname = 'salon_owner_transfers_salonId_fkey' AND contype = 'f')
              OR NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conrelid = 'public.salon_owner_transfers'::regclass
              AND conname = 'salon_owner_transfers_fromUserId_fkey' AND contype = 'f') THEN
              RAISE EXCEPTION 'Expected cross-PR foreign-key constraints are missing';
            END IF;
          END;
          $verify$;
          SQL
      - name: Strict new admin and discovery regression tests (no baseline allowance)
        working-directory: apps/backend
        run: |
          npx jest --ci --runInBand --runTestsByPath \
            src/admin/analytics/admin-data-export.spec.ts \
            src/admin/analytics/executive-metrics.spec.ts \
            src/admin/analytics/admin-timeseries.spec.ts \
            src/admin/admin.controller.spec.ts \
            src/salons/discovery-upgrade.spec.ts

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck --workspace=@barbercue/web
      - name: Strict new feature tests (no baseline allowance)
        working-directory: apps/web
        run: |
          npx jest --ci --runInBand --runTestsByPath \
            components/auth/__tests__/admin-route-access.test.jsx \
            components/admin/command-center/__tests__/CommandCenter.test.jsx \
            components/admin/people/__tests__/people.test.jsx \
            components/admin/charts/__tests__/charts.test.jsx \
            components/admin/shell/__tests__/admin-shell.test.jsx \
            components/discovery/__tests__/discovery-upgrade.test.jsx
      - name: Complete website production build
        run: npm run build --workspace=@barbercue/web

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck --workspace=@barbercue/mobile
      - name: Strict discovery regression tests
        working-directory: apps/mobile
        run: |
          npx jest --ci --runInBand --runTestsByPath \
            lib/__tests__/discovery-search.test.ts \
            screens/__tests__/salon-search-discovery.test.tsx
      - name: Android JS bundle, not physical-device certification
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/android-export"
