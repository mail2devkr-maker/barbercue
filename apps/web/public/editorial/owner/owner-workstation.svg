    <rect x="94" y="256" width="372" height="28" rx="8" fill="#FBF4E7" fill-opacity="0.06" />
    <circle cx="112" cy="270" r="6" fill="#A8791F" />
    <rect x="128" y="266" width="160" height="8" rx="4" fill="#FBF4E7" fill-opacity="0.4" />

    <rect x="94" y="292" width="372" height="28" rx="8" fill="#FBF4E7" fill-opacity="0.06" />
    <circle cx="112" cy="306" r="6" fill="#B0413E" />
    <rect x="128" y="302" width="130" height="8" rx="4" fill="#FBF4E7" fill-opacity="0.4" />
  </g>

  <circle cx="466" cy="112" r="5" fill="#A8791F" />
