<svg viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc-owner-title">
  <title id="bc-owner-title">BarberCue editorial mark for the shop owner workspace</title>
  <rect width="560" height="420" rx="24" fill="#1C1A17" />
  <circle cx="470" cy="60" r="150" fill="#A8791F" fill-opacity="0.12" />
  <circle cx="70" cy="380" r="130" fill="#B0413E" fill-opacity="0.14" />

  <!-- Dashboard panel -->
  <rect x="70" y="80" width="420" height="260" rx="16" fill="#FBF4E7" fill-opacity="0.06" stroke="#FBF4E7" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="94" y="104" width="140" height="14" rx="7" fill="#FBF4E7" fill-opacity="0.5" />
  <rect x="94" y="130" width="90" height="10" rx="5" fill="#FBF4E7" fill-opacity="0.3" />

  <!-- Three metric cards -->
  <g>
    <rect x="94" y="164" width="112" height="72" rx="12" fill="#FBF4E7" fill-opacity="0.08" stroke="#FBF4E7" stroke-opacity="0.2" />
    <rect x="112" y="182" width="40" height="16" rx="4" fill="#A8791F" fill-opacity="0.75" />
    <rect x="112" y="206" width="70" height="8" rx="4" fill="#FBF4E7" fill-opacity="0.35" />

    <rect x="224" y="164" width="112" height="72" rx="12" fill="#FBF4E7" fill-opacity="0.08" stroke="#FBF4E7" stroke-opacity="0.2" />
    <rect x="242" y="182" width="40" height="16" rx="4" fill="#B0413E" fill-opacity="0.8" />
    <rect x="242" y="206" width="70" height="8" rx="4" fill="#FBF4E7" fill-opacity="0.35" />

    <rect x="354" y="164" width="112" height="72" rx="12" fill="#FBF4E7" fill-opacity="0.08" stroke="#FBF4E7" stroke-opacity="0.2" />
    <rect x="372" y="182" width="40" height="16" rx="4" fill="#FBF4E7" fill-opacity="0.75" />
    <rect x="372" y="206" width="70" height="8" rx="4" fill="#FBF4E7" fill-opacity="0.35" />
  </g>

  <!-- Queue row -->
